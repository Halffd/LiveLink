[package]
name = "livelink"
version = "0.1.0"
edition = "2021"

[lib]
name = "livelink"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
holodex = "0.3"
twitch_api = { version = "0.7", features = ["helix", "client"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
youtube-api = "0.1"
dotenv = "0.15"
kick-rust = "0.1"
futures-util = "0.3"
urlencoding = "2"
libc = "0.2"
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui_extras = { version = "0.29", features = ["image"] }
libmpv2 = { version = "6", features = ["render"] }
libmpv2-sys = "4"
regex = "1"
rusqlite = { version = "0.36", features = ["bundled"] }
pinyin = "0.11"
lindera = "6"
lindera-dictionary = "6"
lindera-ipadic = { version = "6", features = ["embed-ipadic"] }

[[bin]]
name = "cueloopd"
path = "src/bin/cueloopd.rs"

[[bin]]
name = "livelink-player"
path = "src/bin/livelink-player.rs"

[[bin]]
name = "lvp"
path = "src/bin/lvp.rs"

[[bin]]
name = "livelink-server"
path = "src/bin/livelink-server.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
